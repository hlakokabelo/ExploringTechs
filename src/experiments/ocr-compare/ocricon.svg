<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Rounded background (now a thin border) -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Document — much larger, fills ~80% of the canvas -->
  <path d="M14 6h26l14 14v34a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"
        fill="#ffffff" opacity="0.97"/>

  <!-- Folded corner -->
  <path d="M40 6v14h14" fill="none" stroke="#c7d2fe" stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Text lines — bigger and thicker -->
  <rect x="16" y="30" width="32" height="3" rx="1.5" fill="#2563eb"/>
  <rect x="16" y="39" width="32" height="3" rx="1.5" fill="#7c3aed"/>
  <rect x="16" y="48" width="20" height="3" rx="1.5" fill="#2563eb"/>
</svg>