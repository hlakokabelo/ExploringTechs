
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111044"></stop>
      <stop offset="100%" stop-color="#050B2D"></stop>
    </linearGradient>

    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C026D3"></stop>
      <stop offset="50%" stop-color="#6366F1"></stop>
      <stop offset="100%" stop-color="#06B6D4"></stop>
    </linearGradient>

    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"></stop>
      <stop offset="100%" stop-color="#93C5FD"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"></rect>

  <!-- Stars -->
  <g fill="#A5B4FC">
    <circle cx="19" cy="34" r="2"></circle>
    <circle cx="105" cy="25" r="2"></circle>
    <circle cx="108" cy="91" r="1.8"></circle>
    <path d="M29 17v9m-4.5-4.5h9" stroke="#60A5FA" stroke-width="1.5"></path>
    <path d="M100 48v12m-6-6h12" stroke="#C4B5FD" stroke-width="1.5"></path>
  </g>

  <!-- Flask -->
  <path d="M49 29 H79 V43 L99 88
       Q104 101 90 101 H38
       Q24 101 29 88 L49 43 Z" fill="none" stroke="url(#stroke)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"></path>

  <!-- Flask neck -->
  <path d="M46 29 H82" stroke="url(#stroke)" stroke-width="5" stroke-linecap="round"></path>

  <!-- Liquid -->
  <path d="M39 76 L31 91
       Q29 97 39 97
       H89 Q99 97 95 88
       L88 76
       Q76 69 64 77
       Q51 85 39 76 Z" fill="url(#liquid)"></path>

  <!-- Bubbles -->
  <g fill="#FFFFFF">
    <circle cx="49" cy="83" r="3"></circle>
    <circle cx="70" cy="89" r="2"></circle>
    <circle cx="78" cy="79" r="2.5"></circle>
  </g>

  <!-- Orbit -->
  <ellipse cx="64" cy="69" rx="53" ry="16" transform="rotate(-19 64 69)" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round" stroke-dasharray="280 55"></ellipse>

  <!-- Orbit sparkle -->
  <circle cx="110" cy="51" r="3" fill="#67E8F9"></circle>
</svg>
